services:
  db:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: shared-postgres
    restart: always
    # Whole .env goes into the container: the init script needs the
    # per-app POSTGRES_<APP>_* vars, not just the superuser ones.
    env_file: .env

    # Tuned for a Pi 5 hosting a few small apps — one server instead of one per app.
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB

    # Localhost only — apps reach Postgres as `shared-postgres-dbs:5432` on the
    # shared-db network; this port is just for admin tools on the Pi itself.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro

    networks:
      - shared-db

    healthcheck:
      # $$ = read from the container env, not compose interpolation
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  shared-db:
    name: shared-db
