# Pi5 Lab — Episode 5: Speedtest Tracker (catch your ISP slacking)
# Docs: https://docs.speedtest-tracker.dev
services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    ports:
      - "8082:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      APP_KEY: ${APP_KEY}                 # generate: see README
      APP_URL: http://${PI_IP}:8082
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 * * * *"     # hourly, on the hour
      APP_TIMEZONE: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}
    volumes:
      - ./data/config:/config
    restart: unless-stopped
