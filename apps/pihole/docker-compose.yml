# Pi5 Lab — Episode 4: Pi-hole (network-wide ad blocking)
# Docs: https://docs.pi-hole.net
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    ports:
      - "53:53/tcp"          # DNS
      - "53:53/udp"          # DNS
      - "8081:80/tcp"        # Web admin UI -> http://<pi-ip>:8081/admin
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
    volumes:
      - ./data/pihole:/etc/pihole
    cap_add:
      - SYS_NICE            # lets FTL raise its priority (optional but recommended)
    restart: unless-stopped
